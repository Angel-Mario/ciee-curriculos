name: ciee-curriculos

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
        - server_env
      args:
        VITE_SERVER_URL: http://localhost:3000
    init: true
    ports:
      - "3001:80"
    env_file:
      - path: apps/web/.env
        required: false
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
      image: backend:local
      secrets:
        - web_env
        - backend_env
      build:
        context: .
        dockerfile: apps/backend/Dockerfile
      init: true
      restart: unless-stopped
      ports:
        - "127.0.0.1:${APP_PORT:-3000}:3000"
      environment:
        NODE_ENV: production
        PORT: "3000"
        SQLSERVER_HOST: sqlserver
        SQLSERVER_PORT: "1433"
        SQLSERVER_DATABASE: backend_db
        SQLSERVER_USER: sa
        SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in .env}
        SQLSERVER_ENCRYPT: "true"
        SQLSERVER_TRUST_SERVER_CERTIFICATE: "true"
      command:
        [
          "sh",
          "-c",
          "(attempt=0; until pnpm run prisma:migrate:deploy; do attempt=$$((attempt + 1)); [ $$attempt -ge 120 ] && exit 1; sleep 5; done) && pnpm run start:prod",
        ]
      depends_on:
        sqlserver:
          condition: service_healthy
  sqlserver:
      image: mcr.microsoft.com/mssql/server:2022-latest
      environment:
        ACCEPT_EULA: Y
        MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in .env}
        MSSQL_DATABASE: backend_db
      ports:
        - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
      healthcheck:
        test:
          [
            "CMD-SHELL",
            '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "IF DB_ID(N''backend_db'') IS NULL CREATE DATABASE [backend_db]; SELECT 1" -b',
          ]
        interval: 10s
        timeout: 30s
        retries: 120
        start_period: 1200s
      volumes:
        - ciee-curriculos_sqlserver_data:/var/opt/mssql

volumes:
  ciee-curriculos_sqlserver_data:

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
  backend_env:
    file: apps/backend/.env
