name: ciee-curriculos

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
        - backend_env
      args:
        VITE_SERVER_URL: http://localhost:3000
    init: true
    ports:
      - "3001:80"
    env_file:
      - path: apps/web/.env
        required: false
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    image: backend:local
    secrets:
      - web_env
      - backend_env
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      secrets:
        - backend_env
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: "1433"
      SQLSERVER_DATABASE: backend_db
      SQLSERVER_USER: sa
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in apps/backend/.env}
      SQLSERVER_ENCRYPT: "true"
      SQLSERVER_TRUST_SERVER_CERTIFICATE: "true"
      S3_ENDPOINT: http://rustfs:9000
      S3_ENDPOINT_PUBLIC: ${S3_ENDPOINT_PUBLIC:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfs_user}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfs_password_secure}
      S3_BUCKET: ${S3_BUCKET:-curricula}
    command:
      [
        "sh",
        "-c",
        "(attempt=0; until pnpm run prisma:migrate:deploy; do attempt=$$((attempt + 1)); [ $$attempt -ge 120 ] && exit 1; sleep 5; done) && pnpm run start:prod",
      ]
    depends_on:
      sqlserver:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs_init:
        condition: service_completed_successfully
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfs_user}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfs_password_secure}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    volumes:
      - ciee-curriculos_rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  rustfs_init:
    image: amazon/aws-cli:2.27.49
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do sleep 2; done; aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$${S3_BUCKET}" 2>/dev/null || true; printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":"arn:aws:s3:::%s/*"}]}' "$${S3_BUCKET}" > /tmp/public-read.json; aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket "$${S3_BUCKET}" --policy file:///tmp/public-read.json
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-rustfs_user}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-rustfs_password_secure}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-curricula}
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in apps/backend/.env}
      MSSQL_DATABASE: backend_db
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "IF DB_ID(N''backend_db'') IS NULL CREATE DATABASE [backend_db]; SELECT 1" -b',
        ]
      interval: 10s
      timeout: 30s
      retries: 120
      start_period: 1200s
    volumes:
      - ciee-curriculos_sqlserver_data:/var/opt/mssql

volumes:
  ciee-curriculos_sqlserver_data:
  ciee-curriculos_rustfs_data:

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
  backend_env:
    file: apps/backend/.env
